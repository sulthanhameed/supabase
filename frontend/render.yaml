services:
  - type: web
    name: khang-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build      # ← use npm, NOT yarn
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false
