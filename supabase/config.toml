# ─────────────────────────────────────────────────────────────
#  Supabase project configuration (used by the Supabase CLI)
#
#  The whole app (frontend + built-in API) is ONE Next.js app.
#  Supabase provides the backend: hosted PostgreSQL. The app
#  connects with DATABASE_URL (Session pooler URI).
#
#  Quick start:
#    supabase link --project-ref <your-project-ref>
#    supabase db push          # applies supabase/migrations/*
#    supabase db reset         # local dev: re-apply migrations + seed.sql
# ─────────────────────────────────────────────────────────────
project_id = "khang-restaurant"

[api]
  # PostgREST (auto REST API over the DB). The Next.js app talks to
  # Postgres directly, so this is only used by the Supabase Dashboard
  # API docs. All tables have RLS enabled, so the anon key cannot read them.
  enabled = true
  port = 54321
  schemas = ["public", "storage", "graphql_public"]
  extra_search_path = ["public", "extensions"]
  max_rows = 1000

[db]
  port = 54322
  major_version = 15

[db.pooler]
  enabled = true
  port = 6543
  pool_mode = "session"

[studio]
  enabled = true
  port = 54323

# The app does not use Supabase Auth / Storage / Realtime / Edge Functions —
# the built-in Next.js API (src/app/api) handles auth, orders and payments.
[auth]
  enabled = false

[storage]
  enabled = false

[realtime]
  enabled = false

[edge_runtime]
  enabled = false
